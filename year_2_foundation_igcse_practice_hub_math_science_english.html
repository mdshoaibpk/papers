        // Render questions into their respective tab containers
        function renderTab(tabKey, data) {
            const container = document.getElementById(`tab-content-${tabKey}`);
            let html = '';

            data.forEach((item, index) => {
                html += `
                    <div id="q-card-${tabKey}-${item.id}" class="question-card bg-white rounded-2xl shadow-md p-6 border-2 border-slate-100 transition-all hover:shadow-lg">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
                            <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full">Question ${item.id} of 50</span>
                            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 bg-slate-100 px-2.5 py-1 rounded-md">${item.topic}</span>
                        </div>
                        <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4">${item.id}. ${item.q}</h3>
                        
                        <!-- Options Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4" id="options-${tabKey}-${item.id}">
                `;

                item.options.forEach((opt, optIdx) => {
                    html += `
                        <label class="option-label flex items-center gap-3 p-3.5 rounded-xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 cursor-pointer transition">
                            <input type="radio" name="question-${tabKey}-${item.id}" value="${opt}" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" onchange="updateProgress('${tabKey}')">
                            <span class="font-medium text-slate-700 text-sm md:text-base">${opt}</span>
                        </label>
                    `;
                });

                html += `
                        </div>
                        <!-- Feedback and Hint bar -->
                        <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100">
                            <div class="flex items-center gap-2">
                                <button onclick="toggleHint('${tabKey}', ${item.id})" class="no-print text-xs font-bold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                                    💡 Need a Hint?
                                </button>
                                <span id="hint-${tabKey}-${item.id}" class="hidden text-xs text-amber-700 italic bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200">
                                    ${item.hint}
                                </span>
                            </div>
                            <div id="feedback-${tabKey}-${item.id}" class="text-sm font-bold"></div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Switch between tabs
        function switchTab(tabKey) {
            currentActiveTab = tabKey;

            // Update tab button styles
            ['math', 'science', 'english'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const content = document.getElementById(`tab-content-${t}`);
                if (t === tabKey) {
                    btn.className = "tab-btn flex-1 min-w-[140px] py-3 px-6 rounded-xl font-bold text-base transition-all flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-md";
                    content.classList.remove('hidden');
                } else {
                    btn.className = "tab-btn flex-1 min-w-[140px] py-3 px-6 rounded-xl font-bold text-base transition-all flex items-center justify-center gap-2 bg-slate-100 text-slate-600 hover:bg-slate-200";
                    content.classList.add('hidden');
                }
            });

            // Update dashboard titles & progress
            const titles = { math: "Mathematics Dashboard", science: "Science Dashboard", english: "English Dashboard" };
            document.getElementById('active-tab-title').innerText = titles[tabKey];
            updateProgress(tabKey);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleHint(tabKey, id) {
            const hintEl = document.getElementById(`hint-${tabKey}-${id}`);
            hintEl.classList.toggle('hidden');
        }

        function updateProgress(tabKey) {
            if (tabKey !== currentActiveTab) return;
            const data = tabKey === 'math' ? mathQuestions : (tabKey === 'science' ? scienceQuestions : englishQuestions);
            let answeredCount = 0;

            data.forEach(item => {
                const radios = document.getElementsByName(`question-${tabKey}-${item.id}`);
                for (let r of radios) {
                    if (r.checked) {
                        answeredCount++;
                        break;
                    }
                }
            });

            const percent = (answeredCount / 50) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('score-display').innerText = `${answeredCount} / 50 Answered`;
        }

        function gradeActiveTab() {
            const tabKey = currentActiveTab;
            const data = tabKey === 'math' ? mathQuestions : (tabKey === 'science' ? scienceQuestions : englishQuestions);
            let correctCount = 0;

            data.forEach(item => {
                const radios = document.getElementsByName(`question-${tabKey}-${item.id}`);
                let userSelection = null;
                for (let r of radios) {
                    if (r.checked) {
                        userSelection = r.value;
                        break;
                    }
                }

                const card = document.getElementById(`q-card-${tabKey}-${item.id}`);
                const feedback = document.getElementById(`feedback-${tabKey}-${item.id}`);

                card.classList.remove('border-indigo-400', 'border-rose-400', 'bg-indigo-50/20', 'bg-rose-50/20');

                if (userSelection === null) {
                    feedback.innerHTML = `<span class="text-slate-400">⚠️ Unanswered</span>`;
                } else if (userSelection === item.answer) {
                    correctCount++;
                    card.classList.add('border-indigo-400', 'bg-indigo-50/20');
                    feedback.innerHTML = `<span class="text-indigo-600 flex items-center gap-1">✅ Correct! Great job!</span>`;
                } else {
                    card.classList.add('border-rose-400', 'bg-rose-50/20');
                    feedback.innerHTML = `<span class="text-rose-600 flex items-center gap-1">❌ Incorrect (Correct: ${item.answer})</span>`;
                }
            });

            document.getElementById('score-display').innerText = `${correctCount} / 50 Correct`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetCurrentTab() {
            const tabKey = currentActiveTab;
            const data = tabKey === 'math' ? mathQuestions : (tabKey === 'science' ? scienceQuestions : englishQuestions);
            
            data.forEach(item => {
                const radios = document.getElementsByName(`question-${tabKey}-${item.id}`);
                radios.forEach(r => r.checked = false);

                const card = document.getElementById(`q-card-${tabKey}-${item.id}`);
                card.classList.remove('border-indigo-400', 'border-rose-400', 'bg-indigo-50/20', 'bg-rose-50/20');
                document.getElementById(`feedback-${tabKey}-${item.id}`).innerHTML = '';
                document.getElementById(`hint-${tabKey}-${item.id}`).classList.add('hidden');
            });

            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('score-display').innerText = '0 / 50';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize all tabs on window load
        window.onload = function() {
            renderTab('math', mathQuestions);
            renderTab('science', scienceQuestions);
            renderTab('english', englishQuestions);
            updateProgress('math');
        }
    </script>
